name: ACD-038 temporary source transfer
on:
  pull_request:
    paths:
      - '.github/workflows/acd038-transfer.yml'
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified 2019 current-spec IAL Mathematics sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cat > /tmp/sources.tsv <<'EOF'
          2019-01_WMA11-01_QP.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Pure/P1/QP/January%202019%20QP.pdf
          2019-01_WMA11-01_MS.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Pure/P1/MS/January%202019%20MS.pdf
          2019-06_WDM11-01_QP.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Decision/D1/QP/June%202019%20QP.pdf
          2019-06_WDM11-01_MS.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Decision/D1/MS/June%202019%20MS.pdf
          2019-06_WMA11-01_QP.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Pure/P1/QP/June%202019%20QP.pdf
          2019-06_WMA11-01_MS.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Pure/P1/MS/June%202019%20MS.pdf
          2019-06_WMA12-01_QP.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Pure/P2/QP/June%202019%20QP.pdf
          2019-06_WMA12-01_MS.pdf	https://pmt.physicsandmathstutor.com/download/Maths/A-level/Papers/Edexcel-IAL/Pure/P2/MS/June%202019%20MS.pdf
          EOF
          : > payload/download_manifest.tsv
          while IFS=$'\t' read -r name url; do
            echo "Downloading $name"
            curl -fL -A 'Mozilla/5.0' --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "$url" -o "payload/$name"
            test "$(head -c 5 "payload/$name")" = '%PDF-'
            bytes=$(stat -c%s "payload/$name")
            sha=$(sha256sum "payload/$name" | awk '{print $1}')
            printf '%s\tPASS\t%s\t%s\t%s\n' "$name" "$bytes" "$sha" "$url" >> payload/download_manifest.tsv
          done < /tmp/sources.tsv
          cat payload/download_manifest.tsv
          test "$(find payload -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: acd038-transfer-2019-current-pmt
          path: payload/
          retention-days: 1
          if-no-files-found: error
