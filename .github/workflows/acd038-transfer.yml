name: ACD-038 temporary source transfer
on:
  pull_request:
    paths:
      - '.github/workflows/acd038-transfer.yml'
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact source PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cat > /tmp/sources.tsv <<'EOF'
          2025-06_WST02-01_QP.pdf	https://f7b64cf3-fcb1-457c-9e9f-f5e3f43cd8a3.usrfiles.com/ugd/f7b64c_d6b86793b06d478fa3cfaf35452f66d5.pdf
          2025-06_WST02-01_MS.pdf	https://f7b64cf3-fcb1-457c-9e9f-f5e3f43cd8a3.usrfiles.com/ugd/f7b64c_834758b3159640adbcc94986301a5e8f.pdf
          2021-10_WDM11-01_MS.pdf	https://cdn.savemyexams.com/uploads/2022/10/oct-2021-decision-1-ial-maths-edexcel-ms.pdf
          EOF
          : > payload/download_manifest.tsv
          while IFS=$'\t' read -r name url; do
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 "$url" -o "payload/$name"; then
              test "$(head -c 5 "payload/$name")" = '%PDF-'
              bytes=$(stat -c%s "payload/$name")
              sha=$(sha256sum "payload/$name" | awk '{print $1}')
              printf '%s\tPASS\t%s\t%s\t%s\n' "$name" "$bytes" "$sha" "$url" >> payload/download_manifest.tsv
            else
              rm -f "payload/$name"
              printf '%s\tFAIL\t0\t-\t%s\n' "$name" "$url" >> payload/download_manifest.tsv
            fi
          done < /tmp/sources.tsv
          cat payload/download_manifest.tsv
          test "$(find payload -maxdepth 1 -name '*.pdf' | wc -l)" -gt 0
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: acd038-transfer
          path: payload/
          retention-days: 1
          if-no-files-found: error
