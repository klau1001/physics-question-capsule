name: ACD-038 temporary source transfer
on:
  pull_request:
    paths:
      - '.github/workflows/acd038-transfer.yml'
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download 2022 January and June ordinary IAL Mathematics QP/MS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          : > payload/download_manifest.tsv
          units=("WDM11:1" "WMA11:1" "WMA12:2" "WMA13:3" "WMA14:4" "WME01:1" "WME02:2" "WST01:1" "WST02:2")
          sessions=("Jan:January:01" "Jun:June:06")
          download_one() {
            local name="$1" url="$2"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 "$url" -o "payload/$name"; then
              test "$(head -c 5 "payload/$name")" = '%PDF-'
              local bytes sha
              bytes=$(stat -c%s "payload/$name")
              sha=$(sha256sum "payload/$name" | awk '{print $1}')
              printf '%s\tPASS\t%s\t%s\t%s\n' "$name" "$bytes" "$sha" "$url" >> payload/download_manifest.tsv
            else
              rm -f "payload/$name"
              printf '%s\tFAIL\t0\t-\t%s\n' "$name" "$url" >> payload/download_manifest.tsv
            fi
          }
          for session in "${sessions[@]}"; do
            IFS=: read -r folder month mm <<< "$session"
            for item in "${units[@]}"; do
              IFS=: read -r code unit <<< "$item"
              qp_src="Questionpaper-Unit${unit}(${code})-${month}2022.pdf"
              ms_src="Markscheme-Unit${unit}(${code})-${month}2022.pdf"
              qp_enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$qp_src")
              ms_enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$ms_src")
              base="https://papers.xtremepape.rs/Edexcel/Advanced%20Level/Mathematics/2022%20${folder}"
              download_one "2022-${mm}_${code}-01_QP.pdf" "$base/Question-paper/$qp_enc"
              download_one "2022-${mm}_${code}-01_MS.pdf" "$base/Mark-scheme/$ms_enc"
            done
          done
          cat payload/download_manifest.tsv
          test "$(find payload -maxdepth 1 -name '*.pdf' | wc -l)" -gt 0
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: acd038-transfer-2022
          path: payload/
          retention-days: 1
          if-no-files-found: error
